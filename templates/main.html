<!DOCTYPE html>
{% load static %}
<html>
    <head>
        <meta charset='utf-8'>
        <meta http-equiv='X-UA-Compatible' content='IE=edge'>
        <title>Blog</title>
        <meta name='viewport' content='width=device-width, initial-scale=1'>
        <link rel='stylesheet' media="screen" href='{% static "styles/main.css" %}'>
        <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"
                integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg"
                crossorigin="anonymous"></script>
        <script src='{% static "js/main.js" %}'></script>
    </head>
    <body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' hx-boost="true">
        <div id="container">
            {% block content %}{% endblock %}
        </div>
    </body>
</html>
